name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0 or 1.0.0-preview.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build-and-pack:
    name: Build, Pack & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v7
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Restore dependencies
        run: dotnet restore Carotte.slnx

      - name: Build Solution
        run: >
          dotnet build Carotte.slnx
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ steps.get_version.outputs.VERSION }}

      - name: Run Tests
        run: dotnet test Carotte.slnx --configuration Release --no-build

      - name: Pack NuGet Packages
        run: >
          dotnet pack Carotte.slnx
          --configuration Release
          --no-build
          --output ./artifacts
          -p:PackageVersion=${{ steps.get_version.outputs.VERSION }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', steps.get_version.outputs.VERSION) }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          files: ./artifacts/*
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, '-') }}

      - name: NuGet Login (Trusted Publishing / OIDC)
        if: ${{ vars.NUGET_USER != '' || vars.NUGET_USERNAME != '' || secrets.NUGET_USER != '' || secrets.NUGET_USERNAME != '' }}
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ vars.NUGET_USER || vars.NUGET_USERNAME || secrets.NUGET_USER || secrets.NUGET_USERNAME }}

      - name: Push to NuGet.org (Trusted Publishing)
        if: steps.nuget_login.outputs.NUGET_API_KEY != ''
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate

      - name: Push to NuGet.org (API Key Fallback)
        if: steps.nuget_login.outputs.NUGET_API_KEY == '' && env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate

      - name: Push to GitHub Packages
        if: env.GITHUB_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate
