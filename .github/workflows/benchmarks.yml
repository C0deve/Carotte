name: Performance Benchmarks

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Carotte/**'
      - 'Carotte.Benchmarks/**'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Carotte/**'
      - 'Carotte.Benchmarks/**'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:
    inputs:
      filter:
        description: 'Benchmark filter expression'
        required: false
        default: '*MessageTypeResolver* *ConsumerMediator* *PipelineExecution*'
        type: string
      job:
        description: 'BenchmarkDotNet Job profile (e.g. short, medium, default)'
        required: false
        default: 'short'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  deployments: write

jobs:
  benchmark:
    name: Critical Path Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Restore dependencies
        run: dotnet restore Carotte.slnx

      - name: Build Benchmarks
        run: dotnet build Carotte.Benchmarks/Carotte.Benchmarks.csproj --configuration Release --no-restore

      - name: Run Critical Path Benchmarks
        run: |
          dotnet run --project Carotte.Benchmarks/Carotte.Benchmarks.csproj \
            --configuration Release \
            --no-build \
            -- \
            --filter ${{ inputs.filter || '*MessageTypeResolver* *ConsumerMediator* *PipelineExecution*' }} \
            --job ${{ inputs.job || 'short' }} \
            --exporters json github

      - name: Merge Benchmark Results
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const resultsDir = path.join('BenchmarkDotNet.Artifacts', 'results');
          if (!fs.existsSync(resultsDir)) {
            console.error('Directory not found: ' + resultsDir);
            process.exit(1);
          }
          let files = fs.readdirSync(resultsDir).filter(f => f.endsWith('-report-brief.json') && f !== 'combined-benchmark-report.json');
          if (files.length === 0) {
            files = fs.readdirSync(resultsDir).filter(f => (f.endsWith('-report-full.json') || f.endsWith('-report-full-compressed.json')) && f !== 'combined-benchmark-report.json');
          }
          if (files.length === 0) {
            console.error('No benchmark JSON report files found in ' + resultsDir);
            process.exit(1);
          }
          const combined = { Title: 'Carotte Critical Path Benchmarks', Benchmarks: [] };
          for (const file of files) {
            const content = fs.readFileSync(path.join(resultsDir, file), 'utf8');
            const data = JSON.parse(content);
            if (Array.isArray(data.Benchmarks)) {
              combined.Benchmarks.push(...data.Benchmarks);
              if (!combined.HostEnvironmentInfo && data.HostEnvironmentInfo) {
                combined.HostEnvironmentInfo = data.HostEnvironmentInfo;
              }
            }
          }
          const outPath = path.join(resultsDir, 'combined-benchmark-report.json');
          fs.writeFileSync(outPath, JSON.stringify(combined, null, 2));
          console.log(\`Successfully merged \${combined.Benchmarks.length} benchmarks from \${files.length} files into \${outPath}\`);
          "

      - name: Store & Compare Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Carotte Critical Path Benchmarks
          tool: 'benchmarkdotnet'
          output-file-path: BenchmarkDotNet.Artifacts/results/combined-benchmark-report.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: '115%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/
          retention-days: 14
