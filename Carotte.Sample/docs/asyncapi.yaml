asyncapi: 3.1.0
info:
  title: Carotte.Sample Messaging API
  version: 1.0.0
servers:
  default-broker:
    host: localhost:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: Default RabbitMQ broker
channels:
  x.pub.order-cancelled:
    address: x.pub.order-cancelled
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: x.pub.order-cancelled
          type: fanout
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
    messages:
      OrderCancelledEvent:
        $ref: '#/components/messages/OrderCancelledEvent'
  x.pub.order-placed:
    address: x.pub.order-placed
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: x.pub.order-placed
          type: fanout
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
    messages:
      OrderPlacedEvent:
        $ref: '#/components/messages/OrderPlacedEvent'
  x.pub.order-processed:
    address: x.pub.order-processed
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: x.pub.order-processed
          type: fanout
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
    messages:
      OrderProcessedEvent:
        $ref: '#/components/messages/OrderProcessedEvent'
  q.notification-consumer:
    address: q.notification-consumer
    bindings:
      amqp:
        is: queue
        queue:
          name: q.notification-consumer
          durable: true
          exclusive: false
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
    messages:
      OrderProcessedEvent:
        $ref: '#/components/messages/OrderProcessedEvent'
  q.order-audit-consumer:
    address: q.order-audit-consumer
    bindings:
      amqp:
        is: queue
        queue:
          name: q.order-audit-consumer
          durable: true
          exclusive: false
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
    messages:
      OrderPlacedEvent:
        $ref: '#/components/messages/OrderPlacedEvent'
  q.order-processing-consumer:
    address: q.order-processing-consumer
    bindings:
      amqp:
        is: queue
        queue:
          name: q.order-processing-consumer
          durable: true
          exclusive: false
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
    messages:
      OrderPlacedEvent:
        $ref: '#/components/messages/OrderPlacedEvent'
operations:
  publishOrderCancelledEvent:
    action: send
    summary: Publishes OrderCancelledEvent message
    channel:
      $ref: '#/channels/x.pub.order-cancelled'
    messages:
      - $ref: '#/components/messages/OrderCancelledEvent'
  publishOrderPlacedEvent:
    action: send
    summary: Publishes OrderPlacedEvent message
    channel:
      $ref: '#/channels/x.pub.order-placed'
    messages:
      - $ref: '#/components/messages/OrderPlacedEvent'
  publishOrderProcessedEvent:
    action: send
    summary: Publishes OrderProcessedEvent message
    channel:
      $ref: '#/channels/x.pub.order-processed'
    messages:
      - $ref: '#/components/messages/OrderProcessedEvent'
  consumeNotificationConsumer:
    action: receive
    summary: Consumes messages by NotificationConsumer
    channel:
      $ref: '#/channels/q.notification-consumer'
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
    messages:
      - $ref: '#/components/messages/OrderProcessedEvent'
  consumeOrderAuditConsumer:
    action: receive
    summary: Consumes messages by OrderAuditConsumer
    channel:
      $ref: '#/channels/q.order-audit-consumer'
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
    messages:
      - $ref: '#/components/messages/OrderPlacedEvent'
  consumeOrderProcessingConsumer:
    action: receive
    summary: Consumes messages by OrderProcessingConsumer
    channel:
      $ref: '#/channels/q.order-processing-consumer'
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
    messages:
      - $ref: '#/components/messages/OrderPlacedEvent'
components:
  messages:
    OrderCancelledEvent:
      name: OrderCancelledEvent
      title: OrderCancelledEvent
      summary: Represents an event published when an order is cancelled.
      payload:
        $ref: '#/components/schemas/OrderCancelledEvent'
    OrderPlacedEvent:
      name: OrderPlacedEvent
      title: OrderPlacedEvent
      summary: Represents an event published when a customer places a new order.
      payload:
        $ref: '#/components/schemas/OrderPlacedEvent'
    OrderProcessedEvent:
      name: OrderProcessedEvent
      title: OrderProcessedEvent
      summary: Represents an event published when an order has been successfully processed.
      payload:
        $ref: '#/components/schemas/OrderProcessedEvent'
  schemas:
    OrderCancelledEvent:
      type: object
      description: Represents an event published when an order is cancelled.
      properties:
        OrderId:
          type: string
          format: uuid
          description: The unique identifier of the cancelled order.
        Reason:
          type: string
          description: The cancellation reason.
        CancelledAt:
          type: string
          format: date-time
          description: The timestamp when the order was cancelled.
      required:
        - OrderId
        - Reason
        - CancelledAt
    OrderPlacedEvent:
      type: object
      description: Represents an event published when a customer places a new order.
      properties:
        OrderId:
          type: string
          format: uuid
          description: The unique identifier of the order.
        CustomerId:
          type: string
          format: uuid
          description: The unique identifier of the customer.
        CustomerEmail:
          type: string
          description: The email address of the customer.
        TotalAmount:
          type: number
          format: double
          description: The total amount of the order.
        PlacedAt:
          type: string
          format: date-time
          description: The timestamp when the order was placed.
      required:
        - OrderId
        - CustomerId
        - CustomerEmail
        - TotalAmount
        - PlacedAt
    OrderProcessedEvent:
      type: object
      description: Represents an event published when an order has been successfully processed.
      properties:
        OrderId:
          type: string
          format: uuid
          description: The unique identifier of the order.
        CustomerId:
          type: string
          format: uuid
          description: The unique identifier of the customer.
        CustomerEmail:
          type: string
          description: The email address of the customer.
        TotalAmount:
          type: number
          format: double
          description: The total amount processed.
        ProcessedAt:
          type: string
          format: date-time
          description: The timestamp when the order was processed.
      required:
        - OrderId
        - CustomerId
        - CustomerEmail
        - TotalAmount
        - ProcessedAt
