asyncapi: 3.1.0
info:
  title: Carotte.Sample Messaging API
  version: 1.0.0
servers:
  my-broker:
    host: localhost:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: RabbitMQ broker 'my-broker'
channels:
  notifications-exchange.NotificationMessage:
    address: notifications-exchange/NotificationMessage
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: notifications-exchange
          type: direct
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
    messages:
      NotificationMessage:
        $ref: '#/components/messages/NotificationMessage'
  orders-exchange.OrderCreated:
    address: orders-exchange/OrderCreated
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: orders-exchange
          type: direct
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
    messages:
      OrderCreated:
        $ref: '#/components/messages/OrderCreated'
  orders-exchange.order.created:
    address: orders-exchange/order.created
    bindings:
      amqp:
        is: queue
        queue:
          name: order-processing-queue
          durable: true
          exclusive: false
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
    messages:
      OrderCreated:
        $ref: '#/components/messages/OrderCreated'
operations:
  publishNotificationMessage:
    action: send
    summary: Publishes NotificationMessage message
    channel:
      $ref: '#/channels/notifications-exchange.NotificationMessage'
    messages:
      - $ref: '#/components/messages/NotificationMessage'
  publishOrderCreated:
    action: send
    summary: Publishes OrderCreated message
    channel:
      $ref: '#/channels/orders-exchange.OrderCreated'
    messages:
      - $ref: '#/components/messages/OrderCreated'
  consumeMultiMessageConsumer:
    action: receive
    summary: Consumes messages by MultiMessageConsumer
    channel:
      $ref: '#/channels/orders-exchange.order.created'
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
    messages:
      - $ref: '#/components/messages/OrderCreated'
  consumeOrderConsumer:
    action: receive
    summary: Consumes messages by OrderConsumer
    channel:
      $ref: '#/channels/orders-exchange.order.created'
    bindings:
      amqp:
        ack: true
        bindingVersion: 0.3.0
    messages:
      - $ref: '#/components/messages/OrderCreated'
components:
  messages:
    NotificationMessage:
      name: NotificationMessage
      title: NotificationMessage
      summary: Represents a notification sent to a customer.
      payload:
        $ref: '#/components/schemas/NotificationMessage'
    OrderCreated:
      name: OrderCreated
      title: OrderCreated
      summary: Represents an event triggered when a new order is placed.
      payload:
        $ref: '#/components/schemas/OrderCreated'
  schemas:
    NotificationMessage:
      type: object
      description: Represents a notification sent to a customer.
      properties:
        OrderId:
          type: string
          format: uuid
          description: The related order identifier.
        Message:
          type: string
          description: The text message content.
        RecipientEmail:
          type: string
          description: The recipient email address.
      required:
        - OrderId
        - Message
        - RecipientEmail
    OrderCreated:
      type: object
      description: Represents an event triggered when a new order is placed.
      properties:
        OrderId:
          type: string
          format: uuid
          description: The unique identifier of the created order.
        CustomerName:
          type: string
          description: The full name of the customer.
        Amount:
          type: number
          format: double
          description: The total monetary amount for the order.
      required:
        - OrderId
        - CustomerName
        - Amount
